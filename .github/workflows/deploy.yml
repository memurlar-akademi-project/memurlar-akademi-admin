name: Deploy Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memurlar-akademi-admin
  NEXT_PUBLIC_API_URL: /api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 2
          done

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            DEPLOY_IMAGE="$DEPLOY_IMAGE" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          exec 9>/tmp/memurlar-akademi-deploy.lock
          flock -w 600 9

          APP_DIR="/var/www/memurlar-akademi/admin"
          ENV_FILE="$APP_DIR/.env.production"
          APP_NAME="memurlar-admin"
          TEST_NAME="memurlar-admin-next"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$DEPLOY_IMAGE"

          docker rm -f "$TEST_NAME" >/dev/null 2>&1 || true
          docker run -d \
            --name "$TEST_NAME" \
            --env-file "$ENV_FILE" \
            -e HOSTNAME=0.0.0.0 \
            -e PORT=3000 \
            "$DEPLOY_IMAGE"

          TEST_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$TEST_NAME")
          for attempt in $(seq 1 30); do
            if curl -fsS "http://$TEST_IP:3000/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$TEST_NAME" --tail 120
              docker rm -f "$TEST_NAME" >/dev/null 2>&1 || true
              exit 1
            fi
            sleep 1
          done

          docker rm -f "$TEST_NAME" >/dev/null 2>&1 || true
          pm2 stop "$APP_NAME" >/dev/null 2>&1 || true
          pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
          docker rm -f "$APP_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -e HOSTNAME=0.0.0.0 \
            -e PORT=3000 \
            -p 127.0.0.1:3001:3000 \
            "$DEPLOY_IMAGE"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$APP_NAME" --tail 120
              exit 1
            fi
            sleep 1
          done

          pm2 save
          # Keep active images and a seven-day rollback window. Persistent
          # volumes are intentionally excluded from automated cleanup.
          docker container prune --filter "until=168h" --force >/dev/null 2>&1 || true
          docker image prune --all --filter "until=168h" --force >/dev/null 2>&1 || true
          REMOTE
